<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¡Pago exitoso! — ExpertIA</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
<style>
:root { --cyan:#00f2ff; --green:#00ff9d; --bg:#030608; --border:rgba(0,242,255,0.15); --text:#e0f0f5; --muted:#5a7a85; }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Syne',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:40px 20px; }
.card { background:rgba(8,13,16,0.8); border:1px solid rgba(0,255,157,0.3); border-radius:24px; padding:50px 40px; max-width:480px; width:100%; text-align:center; }
.icon { font-size:4rem; color:var(--green); margin-bottom:20px; }
h1 { font-size:2rem; font-weight:800; margin-bottom:12px; }
p { color:var(--muted); margin-bottom:32px; line-height:1.6; }
.btn { background:linear-gradient(135deg, var(--cyan), var(--green)); color:#000; font-weight:700; padding:14px 32px; border-radius:12px; text-decoration:none; display:inline-flex; align-items:center; gap:8px; font-family:'Syne',sans-serif; }
</style>
<!-- Google AdSense -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4478373683231277" crossorigin="anonymous"></script>
</head>
<body>
<div class="card">
  <div class="icon"><i class="bi bi-check-circle-fill"></i></div>
  <h1>¡Pago exitoso!</h1>
  <p>Ya tenés acceso a todas las funciones de ExpertIA, totalmente gratis. ¡Aprovechalo al máximo!</p>
  <a href="/dashboard" class="btn">
    <i class="bi bi-rocket-takeoff"></i> Ir al Dashboard
  </a>
</div>
</body>
</html>
