<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crear Cuenta — ExpertIA</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
<style>
:root { --cyan:#00f2ff; --green:#00ff9d; --bg:#030608; --bg2:#080d10; --card:rgba(0,242,255,0.04); --border:rgba(0,242,255,0.15); --text:#e0f0f5; --muted:#5a7a85; }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Syne',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:40px 20px; }
#bg-canvas { position:fixed; top:0; left:0; width:100%; height:100%; z-index:0; pointer-events:none; }
.auth-card { position:relative; z-index:1; width:100%; max-width:480px; background:rgba(8,13,16,0.8); backdrop-filter:blur(20px); border:1px solid var(--border); border-radius:24px; padding:40px; box-shadow:0 20px 50px rgba(0,0,0,0.5); }
.auth-header { text-align:center; margin-bottom:32px; }
.auth-logo { font-family:'Space Mono',monospace; color:var(--cyan); font-size:1.5rem; font-weight:700; margin-bottom:8px; display:block; text-decoration:none; }
.auth-title { font-size:1.5rem; font-weight:700; margin-bottom:8px; }
.auth-subtitle { color:var(--muted); font-size:0.9rem; }
.form-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
@media(max-width:480px){ .form-grid { grid-template-columns:1fr; } }
.form-group { margin-bottom:20px; }
.form-label { display:block; font-family:'Space Mono',monospace; font-size:0.75rem; color:var(--cyan); text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; }
.form-input, .form-select { width:100%; background:rgba(255,255,255,0.05); border:1px solid var(--border); border-radius:12px; padding:12px 16px; color:var(--text); font-family:'Syne',sans-serif; font-size:0.95rem; transition:all 0.3s; }
.form-select option { background:var(--bg2); color:var(--text); }
.form-input:focus, .form-select:focus { outline:none; border-color:var(--cyan); background:rgba(0,242,255,0.05); box-shadow:0 0 15px rgba(0,242,255,0.1); }
.checkbox-group { display:flex; align-items:flex-start; gap:10px; margin-bottom:24px; }
.checkbox-group input { margin-top:4px; }
.checkbox-label { font-size:0.8rem; color:var(--muted); line-height:1.4; }
.checkbox-label a { color:var(--cyan); text-decoration:none; }
.btn-primary { width:100%; background:linear-gradient(135deg, var(--cyan), var(--green)); color:#000; font-weight:700; font-family:'Syne',sans-serif; padding:14px; border-radius:12px; font-size:1rem; transition:all 0.3s; display:flex; align-items:center; justify-content:center; gap:8px; border:none; cursor:pointer; }
.btn-primary:hover { transform:translateY(-2px); box-shadow:0 8px 30px rgba(0,242,255,0.3); }
.auth-footer { margin-top:24px; text-align:center; font-size:0.85rem; color:var(--muted); }
.auth-footer a { color:var(--cyan); text-decoration:none; font-weight:600; }
.back-link { display:inline-flex; align-items:center; gap:6px; color:var(--muted); text-decoration:none; font-size:0.85rem; margin-bottom:20px; }
.back-link:hover { color:var(--cyan); }
.error-box { background:rgba(255,71,87,0.1); border:1px solid rgba(255,71,87,0.3); border-radius:10px; padding:12px 16px; margin-bottom:20px; font-size:0.85rem; color:#ff4757; display:flex; align-items:center; gap:8px; }
</style>
<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-5W19ML4HVY"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-5W19ML4HVY');
</script>
<!-- Google AdSense -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4478373683231277" crossorigin="anonymous"></script>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<div class="auth-card">
  <a href="/" class="back-link"><i class="bi bi-arrow-left"></i> Volver al inicio</a>
  <div class="auth-header">
    <a href="/" class="auth-logo">⚡ ExpertIA</a>
    <h1 class="auth-title">Crea tu cuenta gratis</h1>
    <p class="auth-subtitle">Empezá a entrenar tu IA en segundos</p>
  </div>

  {% if error %}
  <div class="error-box"><i class="bi bi-exclamation-circle"></i> {{ error }}</div>
  {% endif %}

  <form action="/register" method="POST">
    <div class="form-grid">
      <div class="form-group">
        <label class="form-label">Nombre</label>
        <input type="text" name="nombre" class="form-input" placeholder="Tu nombre" autocomplete="name">
      </div>
      <div class="form-group">
        <label class="form-label">Profesión</label>
        <select name="profession" class="form-select">
          <option value="General">Seleccioná tu área</option>
          <option value="Mecánico">Mecánico</option>
          <option value="Técnico en frío">Técnico en frío</option>
          <option value="Enfermería">Enfermería</option>
          <option value="Docente">Docente</option>
          <option value="Gastronomía">Gastronomía</option>
          <option value="Electricista">Electricista</option>
          <option value="Plomero">Plomero</option>
          <option value="Contador">Contador/a</option>
          <option value="Viñatero">Viñatero</option>
          <option value="Técnico en PC">Técnico en PC</option>
          <option value="Otro">Otro</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Email</label>
      <input type="email" name="email" class="form-input" placeholder="tu@email.com" autocomplete="email" required>
    </div>
    <div class="form-group">
      <label class="form-label">Contraseña</label>
      <input type="password" name="password" class="form-input" placeholder="Mínimo 6 caracteres" autocomplete="new-password" required minlength="6">
    </div>
    <div class="checkbox-group">
      <input type="checkbox" id="terms" required>
      <label for="terms" class="checkbox-label">
        Acepto los <a href="/privacidad">Términos de Servicio</a> y la <a href="/privacidad">Política de Privacidad</a>.
      </label>
    </div>
    <button type="submit" class="btn-primary">
      Empezar ahora <i class="bi bi-rocket-takeoff"></i>
    </button>
  </form>
  <div class="auth-footer">
    ¿Ya tenés una cuenta? <a href="/login">Iniciá sesión</a>
  </div>
</div>

<script>
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
let W, H, particles = [];
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize(); window.addEventListener('resize', resize);
for(let i=0;i<40;i++) particles.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-0.5)*0.3,vy:(Math.random()-0.5)*0.3,r:Math.random()*1.5+0.5});
function draw() {
  ctx.clearRect(0,0,W,H);
  for(let p of particles) {
    p.x+=p.vx; p.y+=p.vy;
    if(p.x<0||p.x>W) p.vx*=-1; if(p.y<0||p.y>H) p.vy*=-1;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle='rgba(0,242,255,0.3)'; ctx.fill();
  }
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
