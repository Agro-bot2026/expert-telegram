<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verificar Email — ExpertIA</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
<style>
:root { --cyan:#00f2ff; --green:#00ff9d; --bg:#030608; --bg2:#080d10; --card:rgba(0,242,255,0.04); --border:rgba(0,242,255,0.15); --text:#e0f0f5; --muted:#5a7a85; }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Syne',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:40px 20px; }
#bg-canvas { position:fixed; top:0; left:0; width:100%; height:100%; z-index:0; pointer-events:none; }
.auth-card { position:relative; z-index:1; width:100%; max-width:440px; background:rgba(8,13,16,0.8); backdrop-filter:blur(20px); border:1px solid var(--border); border-radius:24px; padding:40px; box-shadow:0 20px 50px rgba(0,0,0,0.5); }
.auth-header { text-align:center; margin-bottom:32px; }
.auth-logo { font-family:'Space Mono',monospace; color:var(--cyan); font-size:1.5rem; font-weight:700; margin-bottom:8px; display:block; text-decoration:none; }
.auth-title { font-size:1.5rem; font-weight:700; margin-bottom:8px; }
.auth-subtitle { color:var(--muted); font-size:0.9rem; }
.form-group { margin-bottom:20px; }
.form-label { display:block; font-family:'Space Mono',monospace; font-size:0.75rem; color:var(--cyan); text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; }
.form-input { width:100%; background:rgba(255,255,255,0.05); border:1px solid var(--border); border-radius:12px; padding:12px 16px; color:var(--text); font-family:'Syne',sans-serif; font-size:0.95rem; transition:all 0.3s; text-align:center; letter-spacing:8px; }
.form-input:focus { outline:none; border-color:var(--cyan); background:rgba(0,242,255,0.05); box-shadow:0 0 15px rgba(0,242,255,0.1); }
.btn-primary { width:100%; background:linear-gradient(135deg, var(--cyan), var(--green)); color:#000; font-weight:700; font-family:'Syne',sans-serif; padding:14px; border-radius:12px; font-size:1rem; transition:all 0.3s; display:flex; align-items:center; justify-content:center; gap:8px; border:none; cursor:pointer; }
.btn-primary:hover { transform:translateY(-2px); box-shadow:0 8px 30px rgba(0,242,255,0.3); }
.btn-secondary { width:100%; background:transparent; border:1px solid var(--border); color:var(--text); font-weight:600; font-family:'Syne',sans-serif; padding:12px; border-radius:12px; font-size:0.9rem; transition:all 0.3s; cursor:pointer; margin-top:12px; }
.btn-secondary:hover { border-color:var(--cyan); color:var(--cyan); }
.error-box { background:rgba(255,71,87,0.1); border:1px solid rgba(255,71,87,0.3); border-radius:10px; padding:12px 16px; margin-bottom:20px; font-size:0.85rem; color:#ff4757; display:flex; align-items:center; gap:8px; }
.success-box { background:rgba(0,255,157,0.1); border:1px solid rgba(0,255,157,0.3); border-radius:10px; padding:12px 16px; margin-bottom:20px; font-size:0.85rem; color:var(--green); display:flex; align-items:center; gap:8px; }
.timer { text-align:center; color:var(--muted); font-size:0.8rem; margin-top:16px; font-family:'Space Mono',monospace; }
</style>
<!-- Google AdSense -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4478373683231277" crossorigin="anonymous"></script>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<div class="auth-card">
  <div class="auth-header">
    <a href="/" class="auth-logo">⚡ ExpertIA</a>
    <h1 class="auth-title">Verifica tu email</h1>
    <p class="auth-subtitle">Ingresá el código de 6 dígitos que te enviamos</p>
  </div>

  {% if error %}
  <div class="error-box"><i class="bi bi-exclamation-circle"></i> {{ error }}</div>
  {% endif %}

  {% if success %}
  <div class="success-box"><i class="bi bi-check-circle"></i> {{ success }}</div>
  {% endif %}

  <form action="/verificar" method="POST">
    <div class="form-group">
      <label class="form-label">Código de verificación</label>
      <input type="text" name="codigo" class="form-input" placeholder="000000" maxlength="6" inputmode="numeric" required autofocus>
    </div>
    <button type="submit" class="btn-primary">
      <i class="bi bi-check-circle"></i> Verificar
    </button>
  </form>

  <form action="/reenviar-codigo" method="POST">
    <button type="submit" class="btn-secondary">
      <i class="bi bi-arrow-clockwise"></i> Reenviar código
    </button>
  </form>

  <div class="timer">
    ⏱️ El código expira en 10 minutos
  </div>
</div>

<script>
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
let W, H, particles = [];
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize(); window.addEventListener('resize', resize);
for(let i=0;i<40;i++) particles.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-0.5)*0.3,vy:(Math.random()-0.5)*0.3,r:Math.random()*1.5+0.5});
function draw() {
  ctx.clearRect(0,0,W,H);
  for(let p of particles) {
    p.x+=p.vx; p.y+=p.vy;
    if(p.x<0||p.x>W) p.vx*=-1; if(p.y<0||p.y>H) p.vy*=-1;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle='rgba(0,242,255,0.3)'; ctx.fill();
  }
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
